name: Capture current Zomboidz prototype

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snapshot.yml"
      - "scripts/sync-from-live.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download the current game and restore editable source
        run: node scripts/sync-from-live.mjs
      - name: Commit complete game source and packaged assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html style.css game.js game.js.gz SPEC.md CREDITS.md src/game.js assets
          if git diff --cached --quiet; then
            echo "No game changes to commit."
          else
            git commit -m "feat: import playable v0.8 WebXR game, source and runtime assets [skip ci]"
            git push origin HEAD:main
          fi
